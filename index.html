<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 15 AU - Full Simulator</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        /* ==================== DESAIN TAMPILAN STYLE (CSS) ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }
        body {
            background-color: #0f1115;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Frame Fisik iPhone 15 */
        .iphone-15 {
            width: 375px;
            height: 812px;
            border-radius: 45px;
            border: 12px solid #2d3238;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            background: url('https://unsplash.com') center/cover no-repeat;
        }

        /* Dynamic Island Khas iPhone 15 */
        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: black;
            border-radius: 20px;
            z-index: 10;
        }

        /* Struktur Dasar Semua Lapisan Layar */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* Status Bar Atas */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 18px 30px 10px 30px;
            font-size: 0.8rem;
            color: white;
            z-index: 5;
        }

        /* ================= LAYAR 1: LOCK SCREEN ================= */
        .lock-screen {
            z-index: 4;
            background: rgba(0,0,0,0.15);
            padding: 40px 20px;
            touch-action: none;
        }
        .lock-screen.swiped-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .ios-time-wrapper {
            text-align: center;
            color: white;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .ios-time-wrapper p {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .ios-time-wrapper h1 {
            font-size: 4.8rem;
            font-weight: 300;
            line-height: 1;
        }

        /* Komponen Efek Kaca Blur (Glassmorphism) */
        .ios-widget {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 16px;
            color: white;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .music-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .music-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .music-cover {
            width: 40px;
            height: 40px;
            background: #6a1b9a;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .music-info h4 { font-size: 0.85rem; font-weight: 500; }
        .music-info p { font-size: 0.75rem; color: rgba(255,255,255,0.6); }

        /* Notifikasi WhatsApp dari Yan */
        .notification-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            padding: 15px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .noti-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            font-weight: 600;
        }
        .noti-body h4 { font-size: 0.9rem; font-weight: 600; }
        .noti-body p { font-size: 0.85rem; color: #e2e8f0; margin-top: 2px; }

        .bottom-hint {
            margin-top: auto;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
        .ios-home-indicator-bar {
            width: 140px;
            height: 5px;
            background-color: white;
            border-radius: 10px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ================= LAYAR 2: PASSCODE SCREEN ================= */
        .passcode-screen {
            z-index: 3;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }
        .passcode-screen.show {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .passcode-msg {
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .dots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid white;
            border-radius: 50%;
        }
        .dot.active { background-color: white; }

        /* Tombol Keypad iOS */
        .ios-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 25px;
        }
        .num-key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .num-key:active { background: rgba(255, 255, 255, 0.3); }
        .label-key {
            background: transparent;
            border: none;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* ================= LAYAR 3: HOME SCREEN (UTAMA) ================= */
        .home-screen {
            z-index: 2;
            padding: 50px 20px 20px 20px;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.1);
        }
        .home-screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Widget Tampilan Home Screen */
        .home-widgets-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .home-widget {
            flex: 1;
            height: 140px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 15px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Widget Jam Internal */
        .widget-clock-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .widget-clock-content h2 { font-size: 2rem; font-weight: 400; line-height: 1.1; }
        .widget-clock-content p { font-size: 0.75rem; color: #cbd5e1; margin-top: 4px; }

        /* Widget Note Belanja */
        .widget-note-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .widget-note-content .title { font-size: 0.75rem; font-weight: 600; color: #ffd60a; margin-bottom: 5px; }
        .widget-note-content p { font-size: 0.75rem; line-height: 1.3; color: #f8fafc; }

        /* Tata Letak Kisi Aplikasi (App Grid) */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 14px;
            padding: 10px 5px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            cursor: pointer;
        }
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            margin-bottom: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .app-item:active .app-icon { transform: scale(0.9); }
        .app-item span { font-size: 0.72rem; text-align: center; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* Warna Gradasi Spesifik Icon Aplikasi iPhone */
        .icon-gallery { background: linear-gradient(135deg, #4facfe, #00f2fe); }
